# Example YDLIDAR G6 driver parameters for the follower (ydlidar_ros2_driver, stock G6 values).
# Set port to your device (a udev symlink is safer than /dev/ttyUSB*). frame_id must match the
# LiDAR link of the robot model; the mounting yaw is set in rover_follower.yaml (lidar_yaw_offset).
ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/ttyUSB0
    frame_id: base_scan
    ignore_array: ""
    baudrate: 512000
    lidar_type: 1
    device_type: 0
    sample_rate: 18
    abnormal_check_count: 4
    fixed_resolution: true
    reversion: true
    inverted: true
    auto_reconnect: true
    isSingleChannel: false
    intensity: false
    support_motor_dtr: false
    angle_max: 180.0
    angle_min: -180.0
    range_max: 25.0
    range_min: 0.1
    frequency: 10.0
    invalid_range_is_inf: false

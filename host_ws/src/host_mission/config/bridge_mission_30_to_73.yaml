# Host (30) -> follower (73): mission state / queue broadcast, the follower's mission command,
# the e-stop line, the leader's live global position and planned route (the host only relays),
# and the leader's platooning control topics relayed on from 25 -> 30.
# /follower/global/position arrives via the host_to_follower localization bridge, not here.
name: mission_30_to_73
from_domain: 30
to_domain: 73
topics:
  mission/state:
    type: std_msgs/msg/String
    qos: {reliability: reliable, durability: transient_local}
  mission/queue:
    type: host_mission_interfaces/msg/MissionQueue
    qos: {reliability: reliable, durability: transient_local}
  follower/target_cmd:
    type: host_mission_interfaces/msg/TargetCommand
    qos: {reliability: reliable, durability: transient_local}
  estop:
    type: std_msgs/msg/Bool
    qos: {reliability: reliable, durability: transient_local}
  leader/global/position:
    type: geometry_msgs/msg/PoseStamped
    qos: {reliability: reliable}
  leader/route:
    type: host_mission_interfaces/msg/LeaderRoute
    qos: {reliability: reliable, durability: transient_local}
  leader/follower_enable:
    type: std_msgs/msg/Bool
    qos: {reliability: reliable, durability: transient_local}
  leader/platoon_mode:
    type: std_msgs/msg/String
    qos: {reliability: reliable, durability: transient_local}
  leader/task_state:
    type: std_msgs/msg/String
    qos: {reliability: reliable, durability: transient_local}
  leader/heartbeat:
    type: std_msgs/msg/Bool
    qos: {reliability: best_effort}
  # ---- path mode (nav_mode: path); the entries above serve nav_mode: lane ----
  follower/path_cmd:
    type: host_mission_interfaces/msg/PathCommand
    qos: {reliability: reliable, durability: transient_local, history: keep_last, depth: 1}
  follower/localization_quality:
    type: std_msgs/msg/String
    qos: {reliability: reliable, durability: transient_local, history: keep_last, depth: 1}

# Follower(73) -> Host(30): nav feedback (mission contract return path).
name: mission_73_to_30
from_domain: 73
to_domain: 30
topics:
  follower/nav_feedback:
    type: host_mission_interfaces/msg/NavFeedback
    # Reliable end to end: a best_effort relay would reach the reliable subscriber as nothing.
    qos: {reliability: reliable}
  # ---- path mode (nav_mode: path); the entries above serve nav_mode: lane ----
  follower/safety_state:
    type: host_mission_interfaces/msg/SafetyState
    qos: {reliability: reliable, history: keep_last, depth: 10}

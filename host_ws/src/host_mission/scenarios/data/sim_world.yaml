# Layout-scenario world (host_sim default world, rover start poses of the real layout).
# The leader's depth_scan is a copy of sim_default.yaml's; keep the two equal. Plain YAML
# (not a ROS parameter file), loaded by host_sim.config.load_config and passed to
# World.from_config.
# The base command model (omega_quantum / omega_quantize / omega_deadband / cmd_timeout) is
# taken from measurements on the real rovers. Slip/efficiency values (forward_efficiency,
# tread_ratio, icr_offset_x) and hw_angular_sign are unverified placeholders. Units: m, rad, s.
# cmd_timeout: seconds without a command before the base stops; null (or 0) means the base
# never times out and keeps executing the last command.

seed: null            # integer for reproducible noise

arena:                # camera ROI = pipe-enclosed floor in uwb_global (arena frame)
  x_min: 0.25
  x_max: 5.10
  y_min: 0.35
  y_max: 3.10
  walls_enabled: true # boundary appears in LiDAR scans
  # On site the bounds are the ceiling camera's view, not a wall: pipes lie on the floor at
  # or just outside them, the room walls are further out. Depth camera: a 0.05 m pipe is seen
  # only from 1.67 m on (host_sim LidarParams band rule); the LiDAR model has no band and
  # sees it as a wall.
  border_top: 0.05      # m; pipe height (not measured)
  room_wall_offset: null  # m outside the bounds; room wall distance (not measured, none in range)

robots:
  leader:             # 4WD skid-steer + manipulator
    start: [0.86, 1.45, 0.0]          # body origin x, y, theta
    base:
      max_linear_speed: 0.22
      max_angular_speed: 2.84
      linear_time_constant: 0.15
      angular_time_constant: 0.15
      max_linear_accel: 1.0
      max_angular_accel: 6.0
      cmd_timeout: 1.0              # leader stops ~1 s after commands stop
      forward_efficiency: 0.92      # eta
      tread_ratio: 0.70             # actual / commanded yaw rate
      icr_offset_x: 0.0             # the tracked point is the rotation centre and the body centre
                                    #   (pivot fit, camera boxes)
      omega_quantum: 0.0697         # rad/s, yaw-rate step
      omega_quantize: truncate      # toward zero: 0.02-0.06 -> 0, 0.08-0.10 -> 0.07
      linear_quantum: 0.01          # m/s; leader motor driver source (upstream):
      linear_quantize: truncate     # static_cast<int32_t>(linear_velocity_x * 100)
      omega_deadband: 0.0           # none beyond the truncation
      hw_angular_sign: -1.0         # leader base turns opposite to the command (= rover leader.yaml angular_sign -1)
      ref_offset_x: 0.0             # = rover ref_offset_x 0.0 = host pivot_offset 0.0 (pivot fit,
                                    #   -0.003 +- 0.017)
      radius: 0.13                  # contact circle = corner radius of the planner's 0.18 m
                                    #   square (mission leader footprint, TurtleBot3 Burger body).
    localization:
      mode: ideal                   # ideal = output model below | fused = sensor models +
                                    # host_localization fusion (keys under fused:, see
                                    # host_sim.core.fused; config/sim_profiles.yaml)
      rate_hz: 30.0
      delay: 0.08
      pos_noise_std: 0.02
      degraded_pos_noise_std: 0.08
      heading_noise_std: 0.02
      heading_bias: 0.0
      # Slowly varying error (first-order Gauss-Markov). Off by default until measured on site.
      # Bags (standing still) suggest white noise ~0.003 m, with a bias of a few cm and heading
      # drift of 1-3 deg dominating instead.
      pos_bias_std: 0.0             # m per axis, stationary std
      pos_bias_tau: 10.0            # s, correlation time
      heading_drift_std: 0.0        # rad
      heading_drift_tau: 10.0       # s
      align_mode: immediate         # immediate | after_distance
      align_distance: 0.3
      align_max_omega: 0.2
      align_min_speed: 0.02
      quality: GOOD
    lidar: null                     # the leader has no LiDAR: front sensing is the depth camera
    depth_scan:                     # Astra Mini depth camera as a scan -> /leader/depth_scan
      rate_hz: 10.0                 # (rover_drive depth_front_node output, 80 beams)
      num_beams: 80
      fov: 1.019                    # rad, 58.4 deg (vendor spec)
      range_min: 0.6                # vendor spec 0.6-5 m; nothing is reported outside
      range_max: 5.0
      out_of_range_value: 0.0       # the camera gives no depth beyond range, not inf
      invalid_value: 0.0
      noise_std: 0.02
      mount_x: 0.045                # from the body origin = the tracked point: URDF 0.045 ahead of
                                    # base_link = the host mapper's leader_depth mount_x
      mount_yaw: 0.0
      sensor_height: 0.12           # m, camera above the floor (URDF value, rover_drive leader.yaml)
      # Lower edge of the front-distance band below the optical axis (pipes lower than the
      # edge's height at a distance are passed over). Rows end at rover_drive leader.yaml
      # depth_row_max 0.55: tan = (0.55 - 0.50) * 2 * tan(vfov / 2), with tan(vfov / 2) =
      # (480 / 640) * tan(depth_hfov 1.019 / 2) = 0.419 -> 0.0419 rad = 2.40 deg. Assumes a
      # 640 x 480 image with square pixels (the node reads no vertical intrinsics) and a level
      # camera. The same scanner also stands for the host-map scan, whose rows (depth_scan_row_max
      # 0.48) end 0.9 deg above the axis and see less low stuff.
      band_lower_angle: 0.0419      # rad

  follower:           # differential drive, close to slip-free
    start: [0.86, 2.05, 0.0]          # body origin x, y, theta
    base:
      max_linear_speed: 0.22
      max_angular_speed: 2.84
      linear_time_constant: 0.10
      angular_time_constant: 0.10
      max_linear_accel: 1.0
      max_angular_accel: 6.0
      cmd_timeout: null             # follower never times out
      forward_efficiency: 0.97      # camera 0.88 m / wheel odometry 0.903 m
      tread_ratio: 0.98
      icr_offset_x: 0.063           # rotation centre (axle) 6.3 cm ahead of the body origin, which
                                    #   is the tracked point (icr + ref = 0): the start pose, the
                                    #   radius circle and the LiDAR (mount_x 0 = mapper
                                    #   follower_lidar mount_x 0) stay at the tracked point, as on
                                    #   the TurtleBot3 Waffle (body centre 6.4 cm behind the axle)
      omega_quantum: 0.0            # smooth yaw rate
      omega_quantize: round
      omega_deadband: 0.0
      hw_angular_sign: 1.0
      ref_offset_x: -0.063          # tracked point behind the axle (pivot circle)
                                    #   (= rover follower.yaml ref_offset_x)
      radius: 0.13
    localization:
      mode: ideal                   # see leader
      rate_hz: 30.0
      delay: 0.08
      pos_noise_std: 0.02
      degraded_pos_noise_std: 0.08
      heading_noise_std: 0.02
      heading_bias: 0.0
      pos_bias_std: 0.0             # see leader
      pos_bias_tau: 10.0
      heading_drift_std: 0.0
      heading_drift_tau: 10.0
      align_mode: immediate
      align_distance: 0.3
      align_max_omega: 0.2
      align_min_speed: 0.02
      quality: GOOD
    lidar:
      rate_hz: 10.0                 # YDLIDAR G6: ~9.7 Hz, 1830 beams
      num_beams: 720
      range_min: 0.12
      range_max: 8.0                # YDLIDAR G6 reaches 12+ m. Kept at 8 m: a 3.5 m limit left
                                    #   far cells mapped under a heading error never cleared.
      noise_std: 0.01
      mount_x: 0.0
      mount_yaw: -0.5236            # scan 0 points 30 deg right of body +x (= rover follower.yaml
                                    #   lidar_yaw_offset, mapper follower_lidar mount_yaw)
      blind_sectors: []
      invalid_value: 0.0

obstacles: []        # shelves and boxes come from layouts.yaml

node:                 # sim_node only (ignored by the ROS-free core)
  step_hz: 100.0            # integration / timer rate
  max_step: 0.05            # s, clamp on a late timer tick
  ground_truth_hz: 30.0
  min_distance_hz: 10.0
  status_hz: 1.0            # re-publish of heading_aligned / localization_quality
  frame_id: uwb_global
  scan_frame_id: base_scan

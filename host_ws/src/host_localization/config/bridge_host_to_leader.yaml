# Host -> Leader: 글로벌 위치 (로버 제어 입력). domain 30 -> 25.
# bridge_host_to_follower.yaml의 리더판. (리더 켜지면 검증.)
name: host_to_leader
from_domain: 30
to_domain: 25
topics:
  leader/global/position:
    type: geometry_msgs/msg/PoseStamped
    qos:
      reliability: reliable
  # heading 정렬 상태(=COG 앵커). 로버 init: false면 직진해 COG 부트스트랩, true면 정지.
  # latched(transient_local) — 로버가 늦게 켜져도 현재 정렬 상태를 즉시 수신.
  leader/heading_aligned:
    type: std_msgs/msg/Bool
    qos:
      reliability: reliable
      durability: transient_local

# Host -> Follower: 글로벌 위치 (로버 제어 입력). domain 30 -> 73.
#
# global_position_node가 호스트 domain 30에 /follower/global/position
# (geometry_msgs/PoseStamped, x·y + heading) 발행 → 이 브릿지가 팔로워 domain 73으로 전달.
# 제어 입력이라 reliable (위치 누락보다 확실한 전달 우선; ~10Hz라 reliable 부담 적음).
name: host_to_follower
from_domain: 30
to_domain: 73
topics:
  follower/global/position:
    type: geometry_msgs/msg/PoseStamped
    qos:
      reliability: reliable
  # heading 정렬 상태(=COG 앵커). 로버 init: false면 직진해 COG 부트스트랩, true면 정지.
  # latched(transient_local) — 로버가 늦게 켜져도 현재 정렬 상태를 즉시 수신.
  follower/heading_aligned:
    type: std_msgs/msg/Bool
    qos:
      reliability: reliable
      durability: transient_local

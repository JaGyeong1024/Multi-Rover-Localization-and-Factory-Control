calibration_markers:
  # ── 좌표계 = uwb_global (벽 코너 원점, UWB와 동일 프레임) ──────────────
  # 여기 적은 (x,y)가 그대로 BEV 출력 좌표계가 됨 → 카메라 pose가 uwb_global로
  # 나와 UWB와 직접 비교/퓨전 가능 (map→uwb_global TF = identity).
  #
  # 마커 = AprilTag tag36h11, ID 1~4 = 활동영역 모서리 1~4.
  # unified_calibrator가 ID로 매칭(ID i ↔ 아래 i번째) → 이미지 회전/반전 무관.
  #
  # ⚠️ 좌표는 모서리가 아니라 **태그 중심**이다.
  #   태그(한 변 14.9cm)를 'ㄱ'자 코너가 활동영역 모서리에 딱 맞게, 안쪽으로
  #   붙임 → 태그 중심 = 모서리에서 각 축 +7.45cm(=14.9/2) 안쪽.
  #   검출은 태그 중심(4코너 평균)을 쓰므로 여기에도 중심 좌표를 적는다.
  #   (모서리 실측값을 그대로 넣으면 대각 ~10.5cm systematic 오차)
  #
  #   모서리 실측(uwb_global): 1(1.64,2.11) 2(5.72,2.11) 3(5.72,4.63) 4(1.64,4.63)
  - {id: 1, x: 1.7145, y: 2.1845}   # 좌하단 (모서리 1.64,2.11 → +x+y 안쪽)
  - {id: 2, x: 5.6455, y: 2.1845}   # 우하단 (모서리 5.72,2.11 → -x+y 안쪽)
  - {id: 3, x: 5.6455, y: 4.5555}   # 우상단 (모서리 5.72,4.63 → -x-y 안쪽)
  - {id: 4, x: 1.7145, y: 4.5555}   # 좌상단 (모서리 1.64,4.63 → +x-y 안쪽)

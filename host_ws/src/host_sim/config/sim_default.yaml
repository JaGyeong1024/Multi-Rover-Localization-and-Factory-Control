# host_sim default world. Plain YAML (not a ROS parameter file); loaded by
# host_sim.config.load_config and passed to World.from_config. Units: m, rad, s.
# The base command model (omega_quantum / omega_quantize / omega_deadband / cmd_timeout) follows
# the real rovers; slip / efficiency values (forward_efficiency, tread_ratio, icr_offset_x) are
# approximations.
# cmd_timeout: seconds without a command before the base stops; null (or 0) means the base never
# times out and keeps executing the last command.

seed: null            # integer for reproducible noise

arena:                # camera ROI = pipe-enclosed floor in uwb_global (arena frame)
  x_min: 0.25
  x_max: 5.10
  y_min: 0.35
  y_max: 3.10
  walls_enabled: true # boundary appears in LiDAR scans

robots:
  leader:             # 4WD skid-steer + manipulator
    start: [0.86, 1.45, 0.0]        # body origin x, y, theta
    base:
      max_linear_speed: 0.22
      max_angular_speed: 2.84
      linear_time_constant: 0.15
      angular_time_constant: 0.15
      max_linear_accel: 1.0
      max_angular_accel: 6.0
      cmd_timeout: 1.0              # measured: leader stops ~1 s after commands stop
      forward_efficiency: 0.92      # eta
      tread_ratio: 0.70             # actual / commanded yaw rate
      icr_offset_x: 0.03            # rotation centre ahead of body origin
      omega_quantum: 0.0697         # rad/s, measured yaw-rate step
      omega_quantize: truncate      # toward zero: 0.02-0.06 -> 0, 0.08-0.10 -> 0.07
      linear_quantum: 0.01          # m/s; leader motor driver source (upstream, verified):
      linear_quantize: truncate     # static_cast<int32_t>(linear_velocity_x * 100)
      omega_deadband: 0.0           # none beyond the truncation
      hw_angular_sign: -1.0         # leader base turns opposite to the command (= rover angular_sign -1)
      ref_offset_x: 0.02            # tracked point ahead of the rotation centre (0.05 ahead of
                                    # the body origin). Same meaning as the rover's ref_offset_x:
                                    # set the tracker to this value.
      radius: 0.18
    localization:
      mode: ideal                   # ideal = output model below | fused = sensor models +
                                    # host_localization fusion (keys under fused:, see
                                    # host_sim.core.fused; config/sim_profiles.yaml)
      rate_hz: 30.0
      delay: 0.08
      pos_noise_std: 0.02
      degraded_pos_noise_std: 0.08
      heading_noise_std: 0.02
      heading_bias: 0.0
      # Slowly varying error (first-order Gauss-Markov), off by default. Standing-still
      # recordings suggest white noise ~0.003 m, with a bias of a few cm and heading drift of
      # 1-3 deg dominating instead.
      pos_bias_std: 0.0             # m per axis, stationary std
      pos_bias_tau: 10.0            # s, correlation time
      heading_drift_std: 0.0        # rad
      heading_drift_tau: 10.0       # s
      align_mode: immediate         # immediate | after_distance
      align_distance: 0.3
      align_max_omega: 0.2
      align_min_speed: 0.02
      quality: GOOD
    lidar:
      rate_hz: 5.0
      num_beams: 360
      range_min: 0.12
      range_max: 3.5
      noise_std: 0.01
      mount_x: 0.0
      mount_yaw: 0.0
      blind_sectors: []             # e.g. [[170, 190]] = manipulator post behind
      invalid_value: 0.0
    depth_scan:                     # Astra Mini depth camera as a scan -> /leader/depth_scan
      rate_hz: 10.0                 # (rover_drive depth_front_node output, 80 beams)
      num_beams: 80
      fov: 1.019                    # rad, 58.4 deg (vendor spec)
      range_min: 0.6                # vendor spec 0.6-5 m; nothing is reported outside
      range_max: 5.0
      out_of_range_value: 0.0       # the camera gives no depth beyond range, not inf
      invalid_value: 0.0
      noise_std: 0.02
      mount_x: 0.095                # from the body origin = URDF 0.045 ahead of base_link
                                    # + 0.05 to the tracked point (icr 0.03 + ref 0.02), so
                                    # the host mapper's leader_depth mount_x 0.045 matches
      mount_yaw: 0.0
      sensor_height: 0.12           # m, camera above the floor (URDF value)
      # Lower edge of the front-distance band below the optical axis (pipes lower than the
      # edge's height at a distance are passed over): rows end at depth_row_max 0.55, so
      # tan = (0.55 - 0.50) * 2 * tan(vfov / 2) with tan(vfov / 2) =
      # (480 / 640) * tan(depth_hfov 1.019 / 2) = 0.419 -> 0.0419 rad = 2.40 deg. Assumes a
      # 640 x 480 image with square pixels (the node reads no vertical intrinsics) and a level
      # camera. This one scanner also stands for the host-map scan, whose rows
      # (depth_scan_row_max 0.48) end 0.9 deg above the axis and see less low stuff.
      band_lower_angle: 0.0419      # rad

  follower:           # differential drive, close to slip-free
    start: [0.86, 2.05, 0.0]
    base:
      max_linear_speed: 0.22
      max_angular_speed: 2.84
      linear_time_constant: 0.10
      angular_time_constant: 0.10
      max_linear_accel: 1.0
      max_angular_accel: 6.0
      cmd_timeout: null             # measured: follower never times out
      forward_efficiency: 0.97      # camera 0.88 m / wheel odometry 0.903 m
      tread_ratio: 0.98
      icr_offset_x: 0.063           # axle 6.3 cm ahead of the body origin = tracked point
      omega_quantum: 0.0            # measured: smooth yaw rate
      omega_quantize: round
      omega_deadband: 0.0
      hw_angular_sign: 1.0
      ref_offset_x: -0.063          # = rover ref_offset_x (pivot circle fit)
      radius: 0.13
    localization:
      mode: ideal                   # see leader
      rate_hz: 30.0
      delay: 0.08
      pos_noise_std: 0.02
      degraded_pos_noise_std: 0.08
      heading_noise_std: 0.02
      heading_bias: 0.0
      pos_bias_std: 0.0             # see leader
      pos_bias_tau: 10.0
      heading_drift_std: 0.0
      heading_drift_tau: 10.0
      align_mode: immediate
      align_distance: 0.3
      align_max_omega: 0.2
      align_min_speed: 0.02
      quality: GOOD
    lidar:
      rate_hz: 10.0                 # real YDLIDAR G6: ~9.7 Hz, 1830 beams
      num_beams: 720
      range_min: 0.12
      range_max: 8.0                # YDLIDAR G6 reaches 12+ m; 8 covers the ~5x3 m arena
      noise_std: 0.01
      mount_x: 0.0
      mount_yaw: -0.5236            # scan 0 points 30 deg right of body +x (= rover lidar_yaw_offset,
                                    # mapper follower_lidar mount_yaw)
      blind_sectors: []
      invalid_value: 0.0

obstacles: []         # e.g. - {type: circle, x: 4.0, y: 3.3, radius: 0.1, name: post}
                      #      - {type: rect, x: 5.0, y: 4.0, width: 0.4, height: 0.3, yaw: 0.0}

node:                 # sim_node only (ignored by the ROS-free core)
  step_hz: 100.0            # integration / timer rate
  max_step: 0.05            # s, clamp on a late timer tick
  ground_truth_hz: 30.0
  min_distance_hz: 10.0
  status_hz: 1.0            # re-publish of heading_aligned / localization_quality
  frame_id: uwb_global
  scan_frame_id: base_scan
